[package]
name = "furaoj-rust"
version = "2.0.0"
edition = "2021"
authors = ["nmkdeveloper <nguyenminhkhoi.nmk.dev@gmail.com>"]
description = "High-performance Rust Axum REST API and Tokio TCP Bridge for Fura Online Judge"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
argon2 = "0.5"
subtle = "2.6"
base64 = "0.22"
flate2 = "1.0"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "furaoj-api"
path = "src/main.rs"
